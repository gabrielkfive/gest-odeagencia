# WhatsApp via Evolution API (self-host na Oracle). A chave (EVOLUTION_API_KEY) é segredo:
#   npx wrangler secret put EVOLUTION_API_KEY
# Hostname via nip.io (resolve p/ 136.248.75.53). Cloudflare Workers BLOQUEIA fetch a
# IP cru (erro 1003 "Direct IP access not allowed"); por isso usamos um hostname.
EVOLUTION_API_URL = "http://136.248.75.53.nip.io:8080"
EVOLUTION_INSTANCE = "ark"

# SUPABASE_SERVICE_ROLE_KEY é um segredo — será configurado via:
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY

# Cloudflare Workers AI — transcrição de áudio do WhatsApp (Whisper)
[ai]
binding = "AI"

# Logs no dashboard (Workers > Observability). Sem isso um Error 1102 fica cego:
# não dá pra saber QUAL rota estourou o limite. Com isso, o próximo (se houver)
# mostra a rota e o tempo de CPU.
[observability]
enabled = true
