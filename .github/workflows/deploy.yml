name: Deploy WorkFlowArk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env para o build
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL="https://fxfnonozzekxnxddxsnh.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4Zm5vbm96emVreG54ZGR4c25oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjQwODAsImV4cCI6MjA5NjIwMDA4MH0.ZQmGbuwIq_HM81QH-ch_kJPMrV8AgeX_WCF9iTaglK0"
          VITE_SUPABASE_URL="https://fxfnonozzekxnxddxsnh.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4Zm5vbm96emVreG54ZGR4c25oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjQwODAsImV4cCI6MjA5NjIwMDA4MH0.ZQmGbuwIq_HM81QH-ch_kJPMrV8AgeX_WCF9iTaglK0"
          VITE_SUPABASE_PROJECT_ID="fxfnonozzekxnxddxsnh"
          EOF

      - name: Build
        run: npm run build

      - name: Deploy para Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e85057a4ce95cb115958cbf045f7457c
          # Pinado em 20/08/2026. Sem isto a action usava wrangler 3.90.0, que ja avisava
          # "update available 4.125.0" em todo deploy. Versao PINADA de proposito: o que
          # deploya producao nao pode mudar sozinho embaixo da gente.
          wranglerVersion: '4.125.0'

      # "Deployado" só depois de PROVAR que a URL de produção serve o build novo.
      # Compara o marcador do fonte com o que o site devolve. Falhou = action vermelha.
      - name: Smoke check pós-deploy (marcador em produção)
        run: |
          MARCA=$(grep -oP '(?<=<!-- build )[^ ]+' public/workflowark.html | head -1)
          echo "Marcador esperado: $MARCA"
          sleep 10
          for i in 1 2 3; do
            LIVE=$(curl -sL https://workflowark.arkcontent.workers.dev/workflowark.html | grep -o "build $MARCA" || true)
            if [ -n "$LIVE" ]; then echo "OK: produção serve $MARCA"; exit 0; fi
            echo "tentativa $i: ainda não propagou, aguardando 15s..."; sleep 15
          done
          echo "FALHA: produção NÃO está servindo o build novo ($MARCA)"; exit 1

  # Testes de navegador contra a PRODUCAO ja no ar. Job separado de proposito: roda
  # DEPOIS do deploy, entao nunca bloqueia a subida (regra n1, o sistema nao pode ficar
  # refem de um teste instavel). Se ficar vermelho, o deploy ja aconteceu e o que temos
  # e um aviso de regressao, que e exatamente o que faltava: ate hoje o CI provava que a
  # VERSAO certa subiu, mas nao que o sistema continua FUNCIONANDO.
  testes-producao:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Estatico e instantaneo, roda antes dos de navegador. Pega a classe de bug em que o
      # cliente empurra uma chave que o servidor recusa e a fila descarta em silencio.
      - name: Chaves de sync (cliente x servidor)
        run: node deploy/teste-chaves-sync.mjs

      - name: Segredos (token de link publico so de crypto)
        run: node deploy/teste-segredos.mjs

      - name: Guarda de sessao (painel nao abre sem login)
        run: node deploy/teste-guarda-sessao.mjs https://workflowark.arkcontent.workers.dev/workflowark

      - name: Menu mobile (drawer escondido, abre e fecha)
        run: node deploy/teste-mobile-drawer.mjs https://workflowark.arkcontent.workers.dev/workflowark
